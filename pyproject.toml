[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nimlab"
version = "0.1.0"
description = "NIM Lab: a monorepo of apps built on NVIDIA NIM (council, atlas, forge, arena) with a shared async core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pypdf>=4",
    "jinja2>=3.1",
    "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy",
]

[project.scripts]
nimlab = "nimlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nimlab"]

[tool.hatch.build.targets.sdist]
include = ["src/nimlab", "tests", "docs", "README.md", "pyproject.toml", ".env.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true
