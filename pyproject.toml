[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nimlab"
version = "0.1.0"
description = "NIM Lab: a monorepo of apps built on NVIDIA NIM (council, atlas, forge, arena) with a shared async core."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pypdf>=4",
    "jinja2>=3.1",
    "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
# NIM Lab Studio desktop app: native window + macOS Keychain. Neither is required to run Studio.
desktop = [
    "keyring>=24",
    "pywebview>=5",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy",
    "jsonschema>=4",
]

[project.scripts]
nimlab = "nimlab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nimlab"]

[tool.hatch.build.targets.sdist]
include = ["src/nimlab", "tests", "docs", "README.md", "pyproject.toml", ".env.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
markers = [
    "live: calls the real NVIDIA NIM API (needs NVIDIA_API_KEY and NIMLAB_LIVE=1; skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Newer ruff versions also reformat the code samples in Markdown; keep the hand-aligned docs as is.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests use blocking pathlib/subprocess calls inside async tests on purpose (tiny temp dirs).
"tests/**" = ["B011", "RUF001", "RUF002", "RUF003", "ASYNC240", "ASYNC251"]
# Embedded HTML/CSS/JS template with long lines.
"src/nimlab/arena/report.py" = ["E501"]
# Studio: prose/code samples inside string literals (simulated answers, sample projects, test data).
"src/nimlab/studio/simulate.py" = ["E501"]
"src/nimlab/studio/sim_projects.py" = ["E501"]
"tests/studio/**" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true
